[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-ia"
version = "0.1.0"
description = "Sonar - Assistente de Mobilidade Acessivel"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
search-path = ["src", "avaliacao"]
